<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo-mark-32.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <!-- Chat-shell FOUC guard: theme class before paint on /chat only -->
    <script>
      (function () {
        try {
          var path = location.pathname || '';
          if (!/^\/chat(?:\/|$)/.test(path)) return;
          var key = 'ianai.chat-shell.theme';
          var stored = null;
          try { stored = localStorage.getItem(key); } catch (e) {}
          var theme = (stored === 'obsidian-light' || stored === 'obsidian-dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'obsidian-light'
              : 'obsidian-dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add('chat-shell-route');
          document.documentElement.style.colorScheme = theme === 'obsidian-light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    <style>
      html.chat-shell-route { background: #0b0f14; }
      html.chat-shell-route,
      html.chat-shell-route body,
      html.chat-shell-route #root { height: 100%; overflow: hidden; }
      html.chat-shell-route[data-theme="obsidian-light"] { background: #eef2f6; }
    </style>
    <link rel="stylesheet" href="/design/chat-shell-obsidian-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <title>Advance AI - AI-Powered Ad Script Generator</title>
    <meta name="description" content="Generate high-conversion ad scripts for social media with AI">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
